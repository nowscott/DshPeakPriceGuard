# dsh-peak-price-guard — bundle patch
#
# One row: the Host half. Its behaviour lives in the Client half, which the
# client-modules roster picks up from this package's `dsh.client` declaration
# and `exports["./client"]`.
#
# `config` below is the starting preference set: the Host publishes it to the
# page, and the settings page writes edits back into the profile patch as an
# override of this same row. Keep the keys in step with `client.js`
# (`DEFAULT_CONFIG`) and `index.js`.
- insert:
    - id: peak-price-guard
      name: 'dsh-peak-price-guard'
      config:
        enabled: true
        windows: '09:00-12:00, 14:00-18:00'
        holidaysOffPeak: true
        muteMinutes: 30
        showBadge: true

name: publish

# Publishing is done through npm trusted publishing (OIDC), so there is no
# NPM_TOKEN secret to rotate or forget: GitHub signs a short-lived token for
# this workflow, and npm accepts it because the package lists this exact
# repository + workflow as a trusted publisher.
#
# One-time setup on npmjs.com → package → Settings → Trusted publishing:
#   Provider            GitHub Actions
#   Organization/user   nowscott
#   Repository          DshPeakPriceGuard
#   Workflow filename   publish.yml
#   Allowed actions     npm publish  (stage publish is always allowed)
# The configuration must complete its first publish within 2 days or it expires.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No `registry-url` on purpose: it makes setup-node write an .npmrc
          # containing a `_authToken` line, and an empty token there makes npm
          # try token auth instead of the OIDC exchange.
          package-manager-cache: false
      - name: The tag and package.json must agree
        if: github.event_name == 'push'
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json $version"
            exit 1
          fi
      - name: Toolchain
        run: |
          node --version
          npm --version
          echo "id-token url: ${ACTIONS_ID_TOKEN_REQUEST_URL:+present} token: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
      - name: Check the packaging invariants
        run: node scripts/check.mjs
      - name: Run the behaviour checks
        run: node --test test/peak.test.mjs
      - name: Probe the trusted-publisher exchange
        run: |
          token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::could not obtain an OIDC token from GitHub"
            exit 1
          fi
          echo "$token" | cut -d. -f2 | base64 -d 2>/dev/null | jq -c '{repository, workflow_ref, ref, event_name, repository_visibility}' || true
          code=$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-peak-price-guard" \
            -H "Authorization: Bearer ${token}")
          echo "exchange status: $code"
          cat /tmp/exchange.json
          case "$code" in
            2*) ;;
            *) echo "::error::npm rejected the OIDC exchange — the trusted publisher for this package does not match this workflow"; exit 1 ;;
          esac
      - name: Publish
        run: npm publish --provenance --access public
      - name: Cut a GitHub release from the same tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
          echo "release ready: $GITHUB_REF_NAME"
